<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overlook</title>
<style>
  :root {
    --bg: #12160f;
    --panel: #1b2118;
    --line: #2c3426;
    --text: #e6ecd9;
    --dim: #8d977f;
    --green: #7dce6a;
    --amber: #e0b15a;
    --blue: #8eb4d4;
    --danger: #d07a62;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.35 "Segoe UI", "Liberation Sans", sans-serif; }
  body {
    display: grid;
    grid-template-columns: 220px minmax(0, 1fr) 280px;
    grid-template-rows: minmax(0, 1fr) auto 36px;
    grid-template-areas:
      "side map messages"
      "side traffic messages"
      "foot foot foot";
  }
  aside { grid-area: side; }
  .mapwrap { grid-area: map; }
  .trafficbar { grid-area: traffic; }
  section.messages { grid-area: messages; }
  footer { grid-area: foot; }
  #map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; background: #1a2418; }
  .trafficbar { background: var(--panel); border-top: 1px solid var(--line); padding: 8px 12px 10px; }
  .trafficbar canvas { width: 100%; height: 88px; display: block; background: #10140e; border-radius: 6px; }
  .card { position: absolute; right: 12px; bottom: 12px; background: rgba(18,22,15,0.92); border: 1px solid var(--line); border-radius: 8px; padding: 10px; min-width: 180px; font-size: 12px; }
  h1 { font-size: 22px; letter-spacing: 0.12em; margin: 0; }
  .sub { color: var(--dim); font-size: 12px; margin-bottom: 18px; }
  .k { color: var(--dim); font-size: 11px; letter-spacing: 0.14em; margin: 16px 0 4px; }
  .live { color: var(--green); }
  .stale { color: var(--amber); }
  .bad { color: var(--danger); }
  aside, section { background: var(--panel); border-right: 1px solid var(--line); padding: 16px; overflow: auto; }
  section.messages { border-right: 0; border-left: 1px solid var(--line); }
  .mapwrap { position: relative; min-height: 0; height: 100%; overflow: hidden; }
  body.collapse-left { grid-template-columns: 0 minmax(0, 1fr) 280px; }
  body.collapse-right { grid-template-columns: 220px minmax(0, 1fr) 0; }
  body.collapse-left.collapse-right { grid-template-columns: 0 minmax(0, 1fr) 0; }
  body.collapse-left aside, body.collapse-right section.messages { padding: 0; border: 0; overflow: hidden; }
  .brand { position: absolute; top: 10px; left: 12px; z-index: 2; background: transparent; border: 0; padding: 0; }
  .brand img { width: 148px; height: auto; display: block; filter: drop-shadow(0 2px 6px rgba(0,0,0,0.65)); }
  .fold { position: absolute; top: 50%; z-index: 2; transform: translateY(-50%); background: rgba(18,22,15,0.9); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 8px 5px; }
  .maptools { position: absolute; top: 8px; right: 10px; z-index: 1; display: flex; gap: 8px; align-items: center; background: rgba(18,22,15,0.88); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; font-size: 12px; }
  #msgs { max-height: 210px; overflow: auto; }
  #pings { max-height: 200px; overflow: auto; }
  .msg .arrow { width: 14px; height: 14px; vertical-align: -2px; margin-right: 4px; }
  .sub .pico { width: 14px; height: 14px; display: inline-block; vertical-align: -3px; margin-right: 3px; }
  .msg b { display: block; }
  .msg .when { display: block; font-size: 11px; color: var(--dim); margin-top: 4px; }
  .msg span { float: right; font-size: 12px; }
  form { display: grid; gap: 6px; margin-top: 12px; }
  input, select, button, textarea {
    background: #10140e; color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 7px 8px; font: inherit;
  }
  button { cursor: pointer; }
  .spin { width: 22px; height: 22px; border: 2px solid var(--line); border-top-color: var(--green); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  footer {
    display: flex; justify-content: space-between; align-items: center;
    padding: 0 14px; border-top: 1px solid var(--line); color: var(--dim); font-size: 12px;
  }
  .ping { display: grid; grid-template-columns: 18px 1fr auto; column-gap: 6px; align-items: center; margin: 7px 0; }
  .pico { width: 16px; height: 16px; grid-row: 1 / span 2; }
  .pico svg { width: 16px; height: 16px; display: block; }
  .pdot { width: 8px; height: 8px; border-radius: 50%; }
  .ptime { grid-column: 2; color: var(--dim); font-size: 12px; }
  .statusrow { display: flex; gap: 10px; align-items: center; margin: 6px 0; color: var(--text); }
  .statusrow svg, .infoline svg { width: 18px; height: 18px; display: inline-block; vertical-align: -4px; }
  #newmsg { color: var(--amber); font-weight: 600; }
</style>
</head>
<body>
  <aside>
    <h1>OVERLOOK</h1>
    <div class="sub">by Blackout Comms</div>
    <div class="k">CLUSTER</div>
    <div id="cluster">—</div>
    <div class="k">CONNECTED DEVICE</div>
    <div id="link"><span class="dot off"></span>disconnected</div>
    <div id="deviceinfo" class="sub">No radio</div>
    <form id="connect">
      <select id="saved" name="saved">
        <option value="">Saved radios</option>
      </select>
      <input name="label" placeholder="Name" autocomplete="off">
      <input name="device" placeholder="Device ID" maxlength="6" autocapitalize="characters" autocomplete="off" pattern="[A-Za-z0-9]{6}" title="6 letters or digits">
      <input name="pin" placeholder="PIN" inputmode="numeric" autocomplete="off" pattern="[0-9]+" title="Digits only">
      <label><input type="checkbox" name="save_state" checked> Save state</label>
      <button class="primary" type="submit">Connect</button>
      <button type="button" id="drop">Disconnect</button>
    </form>
    <div class="k">LAST ERROR</div>
    <div id="err" class="bad"></div>
  </aside>
  <div class="mapwrap">
    <div class="brand">
      <img src="/overlook-logo.png" alt="Overlook by Blackout Comms">
    </div>
    <button class="fold" id="fold-left" style="left:8px" type="button">‹</button>
    <button class="fold" id="fold-right" style="right:8px" type="button">›</button>
    <div class="maptools">
      <label><input type="checkbox" id="meshgraph" checked> Mesh graph</label>
      <label><input type="checkbox" id="mgrs"> MGRS</label>
      <label><input type="checkbox" id="criticalonly"> Critical</label>
      <select id="tilesource">
        <option value="esri_topo">ESRI World Topo</option>
        <option value="opentopo">OpenTopoMap</option>
        <option value="osm">OpenStreetMap</option>
        <option value="usgs">USGS Topo</option>
      </select>
      <select id="agefilter">
        <option value="30">30 min</option>
        <option value="60" selected>60 min</option>
        <option value="1440">1 day</option>
        <option value="20160">14 days</option>
        <option value="43200">30 days</option>
        <option value="0">All time</option>
      </select>
    </div>
    <canvas id="map"></canvas>
    <div id="pick" class="card" hidden></div>
  </div>
  <div class="trafficbar">
    <label><input type="checkbox" id="showgraph" checked> Mesh traffic</label>
    <canvas id="spark" height="88"></canvas>
  </div>
  <section class="messages">
    <div class="k">MESSAGES <span id="mcount"></span></div>
    <label><input type="checkbox" id="showmsgs" checked> Show messages</label>
    <div id="msgs"></div>
    <form id="compose">
      <select name="kind">
        <option value="bc">Broadcast</option>
        <option value="dm">Direct</option>
      </select>
      <select name="to" id="to"></select>
      <select name="priority">
        <option>Low</option><option selected>Normal</option><option>Medium</option><option>High</option><option>Critical</option>
      </select>
      <textarea name="msg" rows="2" placeholder="Letters, digits, space, period, comma"></textarea>
      <label><input type="checkbox" name="fm"> Force mesh</label>
      <button class="primary" type="submit" id="send" disabled>Send via radio</button>
      <div id="sending" class="spin" hidden></div>
    </form>
    <div class="k">PINGS</div>
    <label><input type="checkbox" id="showindirect"> Show indirect</label>
    <div id="pings" class="sub"></div>
  </section>
  <footer>
    <div>Local mesh only. Keys stay on the radio.</div>
    <div id="devicetime">Device Time: —</div>
    <div id="radio">NET —</div>
    <div id="newmsg"></div>
  </footer>
<script>
const canvas = document.getElementById("map");
const ctx = canvas.getContext("2d");
let state = null;
let sendingUntil = 0;
let view = {lat: 39.8, lon: -98.5, zoom: 4};
const tileCache = new Map();

function resize() {
  const rect = canvas.parentElement.getBoundingClientRect();
  canvas.width = Math.max(1, rect.width) * devicePixelRatio;
  canvas.height = Math.max(1, rect.height) * devicePixelRatio;
}
addEventListener("resize", resize);

function project(devices) {
  const pts = devices.filter(d => d.lat && d.lon && isFinite(+d.lat) && isFinite(+d.lon))
    .map(d => ({...d, lat:+d.lat, lon:+d.lon}));
  if (!pts.length || canvas.width < 10 || canvas.height < 10) return [];
  const scale = 256 * Math.pow(2, view.zoom) * devicePixelRatio;
  const center = mercator(view.lat, view.lon);
  return pts.map(p => {
    const m = mercator(p.lat, p.lon);
    return {...p, x: canvas.width / 2 + (m.x - center.x) * scale, y: canvas.height / 2 + (m.y - center.y) * scale};
  });
}

function mercator(lat, lon) {
  const x = (lon + 180) / 360;
  const s = Math.sin(lat * Math.PI / 180);
  const y = 0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI);
  return {x, y};
}

function tileSource() {
  return document.getElementById("tilesource").value || "esri_topo";
}

function tileImage(z, x, y) {
  const source = tileSource();
  const key = `${source}/${z}/${y}/${x}`;
  if (tileCache.has(key)) return tileCache.get(key);
  const img = new Image();
  img.onload = () => img.ready = true;
  img.src = `/tiles/${source}/${z}/${y}/${x}.png`;
  tileCache.set(key, img);
  return img;
}

function drawTiles() {
  const z = view.zoom;
  const n = 2 ** z;
  const scale = 256 * devicePixelRatio;
  const center = mercator(view.lat, view.lon);
  const world = 256 * n * devicePixelRatio;
  const left = canvas.width / 2 - center.x * world;
  const top = canvas.height / 2 - center.y * world;
  const x0 = Math.floor(-left / scale);
  const y0 = Math.floor(-top / scale);
  const x1 = Math.ceil((canvas.width - left) / scale);
  const y1 = Math.ceil((canvas.height - top) / scale);
  for (let x = x0; x <= x1; x++) {
    for (let y = y0; y <= y1; y++) {
      if (x < 0 || y < 0 || x >= n || y >= n) continue;
      const img = tileImage(z, x, y);
      if (img.ready) ctx.drawImage(img, left + x * scale, top + y * scale, scale, scale);
    }
  }
}

let plotted = [];
let selectedId = null;

function iconGlyph(icon, color) {
  ctx.strokeStyle = color;
  ctx.fillStyle = color;
  ctx.lineWidth = 1.6 * devicePixelRatio;
  const s = 7 * devicePixelRatio;
  if (icon === "root") {
    ctx.beginPath(); ctx.moveTo(-s, 0); ctx.lineTo(0, -s); ctx.lineTo(s, 0); ctx.stroke();
    ctx.strokeRect(-s * 0.7, 0, s * 1.4, s);
  } else if (icon === "relay") {
    ctx.beginPath(); ctx.moveTo(0, s); ctx.lineTo(0, -s); ctx.moveTo(-s, -s * 0.2); ctx.lineTo(s, -s * 0.2); ctx.stroke();
  } else if (icon === "thermal") {
    ctx.beginPath(); ctx.arc(0, s * 0.35, s * 0.45, 0, Math.PI * 2); ctx.moveTo(0, s * 0.35); ctx.lineTo(0, -s); ctx.stroke();
  } else if (icon === "proximity") {
    ctx.beginPath(); ctx.arc(0, 0, s * 0.35, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, s, 0, Math.PI * 2); ctx.stroke();
  } else if (icon === "node") {
    ctx.beginPath(); ctx.moveTo(0, -s); ctx.lineTo(s, 0); ctx.lineTo(0, s); ctx.lineTo(-s, 0); ctx.closePath(); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.arc(0, -s * 0.45, s * 0.35, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-s * 0.7, s); ctx.lineTo(0, -s * 0.05); ctx.lineTo(s * 0.7, s); ctx.stroke();
  }
}
function addrKey(value) {
  return String(value ?? "").replace(/^0+/, "") || "0";
}

function ageMinutes(ts) {
  const s = String(ts || "");
  if (s.length < 12) return Infinity;
  const when = Date.UTC(2000 + +s.slice(0, 2), +s.slice(2, 4) - 1, +s.slice(4, 6), +s.slice(6, 8), +s.slice(8, 10), +s.slice(10, 12));
  return (Date.now() - when) / 60000;
}

function visibleDevices() {
  const maxAge = +(document.getElementById("agefilter").value || 60);
  const criticalOnly = document.getElementById("criticalonly").checked;
  const devices = (state.devices || []).slice();
  if (state.self && !devices.some(d => d.id === state.self.id)) devices.unshift(state.self);
  return devices.filter(d => {
    const self = d.self || (state.self && d.id === state.self.id);
    if (self) return true;
    if (criticalOnly && !d.critical) return false;
    if (maxAge && ageMinutes(d.ts) > maxAge) return false;
    return true;
  });
}

function utmOf(lat, lon) {
  const a = 6378137, f = 1 / 298.257223563, k0 = 0.9996;
  const e2 = f * (2 - f), ep2 = e2 / (1 - e2);
  const zone = Math.floor((lon + 180) / 6) + 1;
  const lon0 = ((zone - 1) * 6 - 180 + 3) * Math.PI / 180;
  const latr = lat * Math.PI / 180, lonr = lon * Math.PI / 180;
  const sin = Math.sin(latr), cos = Math.cos(latr), tan = Math.tan(latr);
  const N = a / Math.sqrt(1 - e2 * sin * sin);
  const T = tan * tan, C = ep2 * cos * cos, A = (lonr - lon0) * cos;
  const M = a * ((1 - e2 / 4 - 3 * e2 * e2 / 64) * latr - (3 * e2 / 8 + 3 * e2 * e2 / 32) * Math.sin(2 * latr) + (15 * e2 * e2 / 256) * Math.sin(4 * latr));
  const east = k0 * N * (A + (1 - T + C) * A ** 3 / 6) + 500000;
  let north = k0 * (M + N * tan * (A * A / 2 + (5 - T + 9 * C + 4 * C * C) * A ** 4 / 24));
  if (lat < 0) north += 10000000;
  return {zone, east, north};
}

function fromUtm(zone, east, north) {
  const a = 6378137, f = 1 / 298.257223563, k0 = 0.9996;
  const e2 = f * (2 - f), ep2 = e2 / (1 - e2);
  const e1 = (1 - Math.sqrt(1 - e2)) / (1 + Math.sqrt(1 - e2));
  const x = east - 500000, y = north;
  const M = y / k0;
  const mu = M / (a * (1 - e2 / 4 - 3 * e2 * e2 / 64));
  const lat1 = mu + (3 * e1 / 2 - 27 * e1 ** 3 / 32) * Math.sin(2 * mu) + (21 * e1 * e1 / 16) * Math.sin(4 * mu);
  const sin = Math.sin(lat1), cos = Math.cos(lat1), tan = Math.tan(lat1);
  const N1 = a / Math.sqrt(1 - e2 * sin * sin);
  const T = tan * tan, C = ep2 * cos * cos, R = a * (1 - e2) / (1 - e2 * sin * sin) ** 1.5, D = x / (N1 * k0);
  const lat = lat1 - (N1 * tan / R) * (D * D / 2 - (5 + 3 * T + 10 * C - 4 * C * C - 9 * ep2) * D ** 4 / 24);
  const lon0 = ((zone - 1) * 6 - 180 + 3) * Math.PI / 180;
  const lon = lon0 + (D - (1 + 2 * T + C) * D ** 3 / 6) / cos;
  return {lat: lat * 180 / Math.PI, lon: lon * 180 / Math.PI};
}

function screenOf(lat, lon) {
  const scale = 256 * Math.pow(2, view.zoom) * devicePixelRatio;
  const center = mercator(view.lat, view.lon);
  const m = mercator(lat, lon);
  return {x: canvas.width / 2 + (m.x - center.x) * scale, y: canvas.height / 2 + (m.y - center.y) * scale};
}

function drawMgrs() {
  const here = utmOf(view.lat, view.lon);
  const step = view.zoom >= 15 ? 100 : view.zoom >= 12 ? 1000 : 10000;
  const digits = step >= 10000 ? 1 : step >= 1000 ? 2 : 3;
  const east0 = Math.floor(here.east / step) * step;
  const north0 = Math.floor(here.north / step) * step;
  const label = (value) => String(Math.round(value) % 100000).padStart(5, "0").slice(0, digits);
  ctx.save();
  ctx.strokeStyle = "rgba(142,180,212,0.55)";
  ctx.lineWidth = 1;
  ctx.font = `${12 * devicePixelRatio}px sans-serif`;
  ctx.textBaseline = "top";
  const stamp = (text, x, y) => {
    const w = ctx.measureText(text).width + 8;
    ctx.fillStyle = "rgba(18,22,15,0.82)";
    ctx.fillRect(x, y, w, 16 * devicePixelRatio);
    ctx.fillStyle = "#d7e6f2";
    ctx.fillText(text, x + 4, y + 2);
  };
  for (let i = -12; i <= 12; i++) {
    const east = east0 + i * step;
    const a = fromUtm(here.zone, east, north0 - 12 * step);
    const b = fromUtm(here.zone, east, north0 + 12 * step);
    const pa = screenOf(a.lat, a.lon), pb = screenOf(b.lat, b.lon);
    ctx.beginPath(); ctx.moveTo(pa.x, pa.y); ctx.lineTo(pb.x, pb.y); ctx.stroke();
    const topY = 40 * devicePixelRatio;
    const ex = pa.y === pb.y ? pa.x : pa.x + (topY - pa.y) * (pb.x - pa.x) / (pb.y - pa.y);
    if (ex > 8 && ex < canvas.width - 48) stamp(label(east), ex + 3, topY);
    const north = north0 + i * step;
    const c = fromUtm(here.zone, east0 - 12 * step, north);
    const d = fromUtm(here.zone, east0 + 12 * step, north);
    const pc = screenOf(c.lat, c.lon), pd = screenOf(d.lat, d.lon);
    ctx.beginPath(); ctx.moveTo(pc.x, pc.y); ctx.lineTo(pd.x, pd.y); ctx.stroke();
    const leftX = 8;
    const ny = pc.x === pd.x ? pc.y : pc.y + (leftX - pc.x) * (pd.y - pc.y) / (pd.x - pc.x);
    if (ny > 24 && ny < canvas.height - 28) stamp(label(north), leftX, ny + 3);
  }
  stamp(`${here.zone}${view.lat >= 0 ? "N" : "S"} ${step}m`, 8, canvas.height - 22 * devicePixelRatio);
  ctx.restore();
}

function draw() {
  resize();
  ctx.fillStyle = "#1a2418";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  drawTiles();
  if (document.getElementById("mgrs").checked) drawMgrs();
  if (!state) { requestAnimationFrame(draw); return; }
  const pts = project(visibleDevices());
  const byAddr = {};
  pts.forEach(p => {
    const key = addrKey(p.address);
    byAddr[key] = p;
    byAddr[String(p.address || "")] = p;
  });
  if (document.getElementById("meshgraph").checked) {
    ctx.lineWidth = 2;
    Object.entries(state.graph || {}).forEach(([src, edges]) => {
      const a = byAddr[src] || byAddr[addrKey(src)];
      if (!a) return;
      Object.entries(edges).forEach(([dst, edge]) => {
        const b = byAddr[dst] || byAddr[addrKey(dst)];
        if (!b || a === b) return;
        ctx.strokeStyle = (edge.direct || 0) >= 50 ? "#6fbf62" : "#8d977f";
        ctx.setLineDash((edge.direct || 0) >= 50 ? [] : [6, 6]);
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();
      });
    });
    ctx.setLineDash([]);
  }
  pts.forEach(p => {
    const self = p.self || (state.self && p.id === state.self.id);
    if (self) {
      ctx.strokeStyle = "rgba(125,206,106,0.35)";
      ctx.beginPath();
      ctx.arc(p.x, p.y, 46 * devicePixelRatio, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.fillStyle = p.direct || self ? "#7dce6a" : (p.stale ? "#6a6254" : "#8d977f");
    ctx.beginPath();
    ctx.arc(p.x, p.y, (self ? 5 : 4) * devicePixelRatio, 0, Math.PI * 2);
    ctx.fill();
    ctx.save();
    ctx.translate(p.x, p.y);
    iconGlyph(p.icon || "user", ctx.fillStyle);
    ctx.restore();
    if (p.id === selectedId) {
      ctx.strokeStyle = "#e0b15a";
      ctx.strokeRect(p.x - 12 * devicePixelRatio, p.y - 14 * devicePixelRatio, 24 * devicePixelRatio, 28 * devicePixelRatio);
    }
    const name = labelOf(p);
    ctx.font = `600 ${13 * devicePixelRatio}px sans-serif`;
    ctx.textBaseline = "middle";
    const pad = 4 * devicePixelRatio;
    const tw = ctx.measureText(name).width;
    const x = p.x + 16 * devicePixelRatio;
    const y = p.y;
    const h = 18 * devicePixelRatio;
    ctx.fillStyle = "rgba(16,20,14,0.88)";
    ctx.beginPath();
    ctx.roundRect(x - pad, y - h / 2, tw + pad * 2, h, 4 * devicePixelRatio);
    ctx.fill();
    ctx.lineWidth = 3 * devicePixelRatio;
    ctx.strokeStyle = "#10140e";
    ctx.strokeText(name, x, y);
    ctx.fillStyle = "#f4f7ee";
    ctx.fillText(name, x, y);
  });
  plotted = pts;
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

function centerOn(lat, lon, zoom) {
  view.lat = +lat;
  view.lon = +lon;
  if (zoom) view.zoom = zoom;
  view.userSet = true;
  fetch("/api/view", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({lat: view.lat, lon: view.lon, zoom: view.zoom})});
}

function fmtTs(ts) {
  const s = String(ts || "");
  if (s.length === 12) return `20${s.slice(0,2)}-${s.slice(2,4)}-${s.slice(4,6)} ${s.slice(6,8)}:${s.slice(8,10)}:${s.slice(10,12)}`;
  return s || "—";
}

function deviceName(device) {
  return device.name || device.id || "—";
}

function labelOf(device) {
  if (!device) return "—";
  if (typeof device === "string") device = findDevice(device) || {name: device};
  return device.nickname || device.nick || deviceName(device);
}

function thermometer() {
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M10 14.5V5a2 2 0 1 1 4 0v9.5a4 4 0 1 1-4 0z"/><circle cx="12" cy="17" r="1.4" fill="#d07a62" stroke="none"/></svg>`;
}

function gpsIcon() {
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2"/></svg>`;
}

function findDevice(id) {
  const key = String(id || "");
  return (state && state.devices || []).find(d => d.id === key || d.address === key || d.name === key || d.nickname === key);
}

function iconSvg(icon) {
  const common = "fill='none' stroke='currentColor' stroke-width='1.6'";
  if (icon === "root") return `<svg viewBox='-8 -8 16 16' ${common}><path d='M-6 0 L0 -7 L6 0'/><rect x='-4' y='0' width='8' height='6'/></svg>`;
  if (icon === "relay") return `<svg viewBox='-8 -8 16 16' ${common}><path d='M0 7 V-7 M-6 -2 H6'/></svg>`;
  if (icon === "thermal") return `<svg viewBox='-8 -8 16 16' ${common}><circle cx='0' cy='3' r='3'/><path d='M0 3 V-7'/></svg>`;
  if (icon === "proximity") return `<svg viewBox='-8 -8 16 16' ${common}><circle cx='0' cy='0' r='2.5'/><circle cx='0' cy='0' r='6'/></svg>`;
  if (icon === "node") return `<svg viewBox='-8 -8 16 16' ${common}><path d='M0 -7 L7 0 L0 7 L-7 0 Z'/></svg>`;
  return `<svg viewBox='-8 -8 16 16' ${common}><circle cx='0' cy='-3' r='2.4'/><path d='M-5 7 L0 0 L5 7'/></svg>`;
}

function sunglasses(color) {
  return `<svg viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="1.8"><path d="M2 10h4l2 3h8l2-3h4"/><rect x="3" y="12" width="7" height="5" rx="1.5" fill="${color}" stroke="none"/><rect x="14" y="12" width="7" height="5" rx="1.5" fill="${color}" stroke="none"/></svg>`;
}

function batteryIcon(level) {
  const word = String(level || "").toLowerCase();
  const color = word.includes("low") ? "#d07a62" : word.includes("med") ? "#e0b15a" : "#7dce6a";
  const fill = word.includes("low") ? 4 : word.includes("med") ? 8 : 12;
  return `<svg viewBox="0 0 24 24" title="battery ${word || "high"}"><rect x="3" y="7" width="16" height="10" rx="1.5" fill="none" stroke="${color}" stroke-width="1.6"/><rect x="19.5" y="10" width="2" height="4" fill="${color}"/><rect x="5" y="9" width="${fill}" height="6" fill="${color}"/></svg>`;
}

function stealthIcon(value) {
  const word = String(value || "n").toLowerCase();
  if (word.startsWith("h")) return sunglasses("#d07a62");
  if (word.startsWith("m")) return sunglasses("#e0b15a");
  if (word.startsWith("l")) return sunglasses("#8eb4d4");
  return sunglasses("#7dce6a");
}

function switchIcon(on) {
  const color = on ? "#7dce6a" : "#d07a62";
  return `<svg viewBox="0 0 24 24" title="relay ${on ? "on" : "off"}"><rect x="4" y="9" width="16" height="8" rx="4" fill="${color}"/><circle cx="${on ? 15 : 9}" cy="13" r="2.4" fill="#12160f"/></svg>`;
}

function relayIcon(value) {
  if (value == null || value === "") return "";
  return `<span title="relay ${value}">${switchIcon(relayOn(value))}</span>`;
}

function relayOn(value) {
  const word = String(value || "").toLowerCase();
  return word === "on" || word === "1" || word === "true" || word === "high";
}

function renderDevice(self, conn) {
  const box = document.getElementById("deviceinfo");
  if (!self) { box.textContent = "No radio"; return; }
  const stealth = (conn && conn.stlth) || "n";
  const relay = relayIcon(self.relayState);
  const lat = self.lat == null ? "—" : Number(self.lat).toFixed(6);
  const lon = self.lon == null ? "—" : Number(self.lon).toFixed(6);
  const alt = self.alt == null || self.alt === "" ? "—" : self.alt;
  const head = self.head == null || self.head === "" ? "—" : self.head;
  const spd = self.speed == null || self.speed === "" ? "—" : Number(self.speed).toFixed(1);
  const tempC = Number(self.temperature);
  const temp = Number.isFinite(tempC) ? `${(tempC * 9 / 5 + 32).toFixed(1)}°F` : "—";
  box.innerHTML = [
    `<div class="statusrow"><span title="${self.icon || "user"}">${iconSvg(self.icon || "user")}</span><span title="battery ${self.batteryLevel || "high"}">${batteryIcon(self.batteryLevel)}</span><span title="stealth ${stealth}">${stealthIcon(stealth)}</span>${relay}</div>`,
    `<span class="infoline" title="temperature">${thermometer()} ${temp}</span>`,
    `<span class="infoline" title="position">${gpsIcon()} [${lat}, ${lon}]</span>`,
    `Alt: ${alt}m, Head: ${head}°`,
    `Spd: ${spd} k/hr`
  ].join("<br>");
}

function pingLabel(dev, id) {
  const found = dev && dev.id ? dev : (findDevice(id) || {});
  const nick = found.nickname || found.nick || "";
  const name = found.name || "—";
  return nick ? `${nick} [${name}]` : `[${name}]`;
}

function validFix(lat, lon) {
  const la = +lat, lo = +lon;
  if (![la, lo].every(Number.isFinite)) return false;
  if (la < -90 || la > 90 || lo < -180 || lo > 180) return false;
  if (la === 0 && lo === 0) return false;
  return true;
}

function rangeText(from, to) {
  if (!validFix(from.lat, from.lon) || !validFix(to.lat, to.lon)) return "";
  const dist = distanceKm(from.lat, from.lon, to.lat, to.lon);
  const bearing = bearingDeg(from.lat, from.lon, to.lat, to.lon);
  if (dist == null || bearing == null) return "";
  return `[${dist.toFixed(1)} km @ ${bearing.toFixed(1)}°]`;
}

function distanceKm(aLat, aLon, bLat, bLon) {
  const lat1 = +aLat, lon1 = +aLon, lat2 = +bLat, lon2 = +bLon;
  if (![lat1, lon1, lat2, lon2].every(Number.isFinite)) return null;
  const r = 6371;
  const p1 = lat1 * Math.PI / 180, p2 = lat2 * Math.PI / 180;
  const dp = (lat2 - lat1) * Math.PI / 180, dl = (lon2 - lon1) * Math.PI / 180;
  const h = Math.sin(dp / 2) ** 2 + Math.cos(p1) * Math.cos(p2) * Math.sin(dl / 2) ** 2;
  return r * 2 * Math.atan2(Math.sqrt(h), Math.sqrt(1 - h));
}

function bearingDeg(aLat, aLon, bLat, bLon) {
  const lat1 = +aLat, lon1 = +aLon, lat2 = +bLat, lon2 = +bLon;
  if (![lat1, lon1, lat2, lon2].every(Number.isFinite)) return null;
  const p1 = lat1 * Math.PI / 180, p2 = lat2 * Math.PI / 180, dl = (lon2 - lon1) * Math.PI / 180;
  const y = Math.sin(dl) * Math.cos(p2);
  const x = Math.cos(p1) * Math.sin(p2) - Math.sin(p1) * Math.cos(p2) * Math.cos(dl);
  return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
}

function deviceCard(device) {
  const lat = device.lat == null ? "—" : Number(device.lat).toFixed(6);
  const lon = device.lon == null ? "—" : Number(device.lon).toFixed(6);
  const alt = device.alt == null || device.alt === "" ? "—" : device.alt;
  const head = device.head == null || device.head === "" ? "—" : device.head;
  const spd = device.speed == null || device.speed === "" ? "—" : Number(device.speed).toFixed(1);
  const tempC = Number(device.temperature);
  const temp = Number.isFinite(tempC) ? `<span class="infoline" title="temperature">${thermometer()} ${(tempC * 9 / 5 + 32).toFixed(1)}°F</span>` : "";
  const here = (state && state.self) || {};
  const dist = distanceKm(here.lat, here.lon, device.lat, device.lon);
  const bearing = bearingDeg(here.lat, here.lon, device.lat, device.lon);
  const range = validFix(here.lat, here.lon) && validFix(device.lat, device.lon) && dist != null && bearing != null
    ? `${dist.toFixed(1)} km @ ${bearing.toFixed(1)}°` : "";
  return [
    `<b>${labelOf(device)}</b>`,
    `<div class="statusrow"><span title="${device.icon || "user"}">${iconSvg(device.icon || "user")}</span><span title="battery ${device.batteryLevel || "—"}">${batteryIcon(device.batteryLevel)}</span>${relayIcon(device.relayState)}</div>`,
    temp,
    `<span class="infoline" title="position">${gpsIcon()} [${lat}, ${lon}]</span>`,
    `Alt: ${alt}m, Head: ${head}°`,
    `Spd: ${spd} k/hr`,
    range
  ].filter(Boolean).join("<br>");
}

function arrowIcon(up, color) {
  const d = up ? "M7 14 V4 M3 7 L7 3 L11 7" : "M7 2 V12 M3 9 L7 13 L11 9";
  return `<svg class="arrow" viewBox="0 0 14 16" fill="none" stroke="${color}" stroke-width="1.8"><path d="${d}"/></svg>`;
}

function messageArrow(m) {
  const self = (state && state.self) || {};
  const sender = String(m.sender || "");
  const sent = m.outbound || sender === self.id || sender === self.name || sender === self.nickname;
  const recipient = String(m.recipient || m.to || "");
  const broadcast = /all devices/i.test(recipient) || m.kind === "bc" || m.bc;
  const mesh = !!(m.fm || m.mesh || m.hops > 1 || m.hop > 1 || m.via === "mesh");
  if (sent && broadcast) return arrowIcon(true, "#e0b15a");
  if (sent && mesh) return arrowIcon(true, "#8eb4d4");
  if (sent) return arrowIcon(true, "#7dce6a");
  if (broadcast) return arrowIcon(false, "#e0b15a");
  if (mesh) return arrowIcon(false, "#8eb4d4");
  return arrowIcon(false, "#7dce6a");
}

function otherParty(m) {
  const self = (state && state.self) || {};
  const sender = String(m.sender || "");
  const sent = m.outbound || sender === self.id || sender === self.name || sender === self.nickname;
  const recipient = String(m.recipient || m.to || "");
  const broadcast = /all devices/i.test(recipient) || m.kind === "bc" || m.bc;
  if (sent && broadcast) return {label: "[All Devices]", icon: ""};
  const other = sent ? recipient : sender;
  const dev = findDevice(other) || {};
  return {label: labelOf(other || dev), icon: iconSvg(dev.icon || "user")};
}

function messageTime(ts) {
  const s = String(ts || "");
  if (s.length >= 12) return `${s.slice(2, 4)}/${s.slice(4, 6)} ${s.slice(6, 8)}:${s.slice(8, 10)}:${s.slice(10, 12)}`;
  return fmtTs(ts);
}

function clock(ts) {
  const s = String(ts || "");
  if (s.length >= 12) return `${s.slice(6, 8)}:${s.slice(8, 10)}:${s.slice(10, 12)}`;
  const shown = fmtTs(ts);
  return shown.length >= 8 ? shown.slice(-8) : shown;
}

function renderTraffic() {
  const show = document.getElementById("showgraph").checked;
  const spark = document.getElementById("spark");
  spark.style.display = show ? "block" : "none";
  const samples = (state && state.traffic) || [];
  if (show && samples.length) {
    const c = spark.getContext("2d");
    spark.width = spark.clientWidth * devicePixelRatio;
    spark.height = 70 * devicePixelRatio;
    c.clearRect(0, 0, spark.width, spark.height);
    const series = [
      ["Packets in", samples.map(s => s.packetsIn || 0), "#7dce6a"],
      ["Packets out", samples.map(s => s.packetsOut || 0), "#8eb4d4"],
      ["Unknown", samples.map(s => s.unknownPackets || 0), "#e0b15a"]
    ];
    const max = Math.max(1, ...series.flatMap(s => s[1]));
    c.font = `${11 * devicePixelRatio}px sans-serif`;
    series.forEach((item, idx) => {
      c.fillStyle = item[2];
      c.fillText(`${item[0]} ${item[1].at(-1) || 0}`, 8 + idx * 118 * devicePixelRatio, 16 * devicePixelRatio);
    });
    series.forEach((item) => {
      c.strokeStyle = item[2];
      c.lineWidth = 2;
      c.beginPath();
      item[1].forEach((v, i) => {
        const x = (i / Math.max(1, item[1].length - 1)) * spark.width;
        const y = spark.height - (v / max) * (spark.height - 28 * devicePixelRatio) - 8;
        i ? c.lineTo(x, y) : c.moveTo(x, y);
      });
      c.stroke();
    });
  }
  const pings = ((state && state.pings) || []).filter(p => document.getElementById("showindirect").checked || p.kind === "DIRECT");
  document.getElementById("pings").innerHTML = pings.map(p => {
    const dev = findDevice(p.id) || {};
    const color = p.kind === "DIRECT" ? "#7dce6a" : "#8eb4d4";
    const name = pingLabel(dev, p.id);
    const fix = validFix(p.lat, p.lon) ? {lat: p.lat, lon: p.lon} : dev;
    const range = p.kind === "DIRECT" ? rangeText(state.self || {}, fix) : "";
    return `<div class="ping"><span class="pico" style="color:${color}">${iconSvg(dev.icon || "node")}</span><b>${name}</b><span class="pdot" style="background:${color}"></span><span class="ptime">${clock(p.ts)} · ${p.rssi ?? "—"} dBm${range ? " " + range : ""}</span></div>`;
  }).join("") || "No pings";
}

async function refresh() {
  const res = await fetch("/api/state");
  state = await res.json();
  if (state.view && !view.restored) {
    view.lat = state.view.lat;
    view.lon = state.view.lon;
    view.zoom = state.view.zoom || view.zoom;
    view.restored = true;
    view.userSet = true;
  } else if (!view.userSet && state.self && state.self.lat) {
    view.lat = +state.self.lat;
    view.lon = +state.self.lon;
    view.zoom = 16;
    view.userSet = true;
  }
  if (state.tilesource && !view.tilesRestored) {
    document.getElementById("tilesource").value = state.tilesource;
    view.tilesRestored = true;
  }
  document.getElementById("cluster").textContent = (state.cluster || "—").toUpperCase();
  const link = document.getElementById("link");
  const self = state.self || {};
  const ble = state.link_name || state.active_radio || "";
  const shown = self.name ? `${self.name}${ble ? ` [${ble}]` : ""}` : (ble || "—");
  link.innerHTML = state.connected
    ? `<span class="dot"></span>${shown}<br><span class="live">connected · ${state.last_rx_age ?? 0}s ago</span>`
    : `<span class="dot off"></span>disconnected`;
  document.getElementById("err").textContent = state.connected ? "" : (state.link_name || "");
  const conn = state.conn || {};
  document.getElementById("devicetime").textContent = `Device Time: ${state.self && state.self.ts ? fmtTs(state.self.ts) : "—"}`;
  document.getElementById("radio").textContent = conn.cfg ? `${conn.net} · ${conn.cfg}` : "NET —";
  renderDevice(state.self, conn);
  const msgs = state.messages || [];
  const showMsgs = document.getElementById("showmsgs").checked;
  document.getElementById("mcount").textContent = msgs.length;
  document.getElementById("msgs").innerHTML = showMsgs ? msgs.map(m => {
    const who = otherParty(m);
    const icon = who.icon ? `<span class="pico">${who.icon}</span>` : "";
    return `<div class="msg"><span class="${m.status === "confirmed" ? "live" : "stale"}">${m.status || ""}</span><b>${messageArrow(m)}${icon}${who.label}</b>${m.text || m.message || ""}<div class="when">${messageTime(m.ts)}</div></div>`;
  }).join("") : "";
  document.getElementById("newmsg").textContent = !showMsgs && msgs.length ? `New messages ${msgs.length}` : "";
  const to = document.getElementById("to");
  const selected = to.value;
  const seen = new Set();
  const devices = (state.devices || []).filter(d => {
    if (d.self || !d.id) return false;
    const key = (d.nickname || d.nick || d.name || d.id).toLowerCase();
    if (seen.has(d.id) || seen.has(key)) return false;
    seen.add(d.id);
    seen.add(key);
    return true;
  });
  devices.sort((a, b) => labelOf(a).localeCompare(labelOf(b)));
  to.innerHTML = devices.map(d => `<option value="${d.id}">${labelOf(d)}</option>`).join("");
  if (selected) to.value = selected;
  to.disabled = document.querySelector("[name=kind]").value === "bc";
  document.getElementById("send").disabled = !state.connected || Date.now() < sendingUntil;
  document.getElementById("send").hidden = Date.now() < sendingUntil;
  document.getElementById("sending").hidden = Date.now() >= sendingUntil;
  renderTraffic();
  const saved = document.getElementById("saved");
  const keep = saved.value;
  saved.innerHTML = `<option value="">Saved radios</option>` + (state.radios || []).map(r =>
    `<option value="${r.device}">${r.label}</option>`).join("");
  if (keep) saved.value = keep;
}
setInterval(refresh, 1000);
refresh();

document.getElementById("tilesource").value = localStorage.getItem("overlook-tiles") || "esri_topo";
document.getElementById("tilesource").onchange = (ev) => {
  localStorage.setItem("overlook-tiles", ev.target.value);
  tileCache.clear();
  fetch("/api/view", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({lat: view.lat, lon: view.lon, zoom: view.zoom, tilesource: ev.target.value})});
};
document.querySelector("[name=kind]").onchange = (ev) => {
  document.getElementById("to").disabled = ev.target.value === "bc";
};
document.getElementById("to").disabled = true;
document.getElementById("fold-left").onclick = () => {
  document.body.classList.toggle("collapse-left");
  document.getElementById("fold-left").textContent = document.body.classList.contains("collapse-left") ? "›" : "‹";
};
document.getElementById("fold-right").onclick = () => {
  document.body.classList.toggle("collapse-right");
  document.getElementById("fold-right").textContent = document.body.classList.contains("collapse-right") ? "‹" : "›";
};
document.getElementById("saved").onchange = (ev) => {
  const radio = (state.radios || []).find(r => r.device === ev.target.value);
  if (!radio) return;
  document.querySelector("[name=label]").value = radio.label || "";
  document.querySelector("[name=device]").value = String(radio.device || "").replace(/^BC-/i, "");
  document.querySelector("[name=pin]").value = radio.pin || "";
  document.querySelector("[name=save_state]").checked = radio.save_state !== false;
};
document.querySelector("[name=device]").addEventListener("input", (ev) => {
  ev.target.value = ev.target.value.toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 6);
});
document.querySelector("[name=pin]").addEventListener("input", (ev) => {
  ev.target.value = ev.target.value.replace(/\D/g, "");
});
document.getElementById("connect").onsubmit = async (ev) => {
  ev.preventDefault();
  const data = Object.fromEntries(new FormData(ev.target));
  data.device = "BC-" + String(data.device || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 6);
  data.pin = String(data.pin || "").replace(/\D/g, "");
  data.label = String(data.label || data.device);
  data.save_state = ev.target.save_state.checked;
  if (data.device === "BC-") return;
  await fetch("/api/connect", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(data)});
  refresh();
};
document.getElementById("drop").onclick = async () => {
  await fetch("/api/disconnect", {method:"POST"});
  refresh();
};
canvas.addEventListener("click", (ev) => {
  const rect = canvas.getBoundingClientRect();
  const x = (ev.clientX - rect.left) * devicePixelRatio;
  const y = (ev.clientY - rect.top) * devicePixelRatio;
  const hit = plotted.slice().reverse().find(p => Math.hypot(p.x - x, p.y - y) < 16 * devicePixelRatio);
  const card = document.getElementById("pick");
  if (!hit) { selectedId = null; card.hidden = true; return; }
  selectedId = hit.id;
  card.hidden = false;
  card.innerHTML = deviceCard(hit);
});
canvas.parentElement.addEventListener("wheel", (ev) => {
  ev.preventDefault();
  view.zoom = Math.max(3, Math.min(18, view.zoom + (ev.deltaY < 0 ? 1 : -1)));
  centerOn(view.lat, view.lon, view.zoom);
}, {passive: false});
let drag = null;
canvas.parentElement.addEventListener("pointerdown", (ev) => { drag = {x: ev.clientX, y: ev.clientY, lat: view.lat, lon: view.lon}; });
addEventListener("pointermove", (ev) => {
  if (!drag) return;
  const world = 256 * (2 ** view.zoom) * devicePixelRatio;
  const dx = (ev.clientX - drag.x) * devicePixelRatio / world;
  const dy = (ev.clientY - drag.y) * devicePixelRatio / world;
  const start = mercator(drag.lat, drag.lon);
  const next = {x: start.x - dx, y: start.y - dy};
  view.lon = next.x * 360 - 180;
  view.lat = Math.atan(Math.sinh(Math.PI * (1 - 2 * next.y))) * 180 / Math.PI;
  view.userSet = true;
});
addEventListener("pointerup", () => {
  if (!drag) return;
  drag = null;
  centerOn(view.lat, view.lon, view.zoom);
});
document.getElementById("compose").onsubmit = async (ev) => {
  ev.preventDefault();
  if (!state || !state.connected || Date.now() < sendingUntil) return;
  const data = Object.fromEntries(new FormData(ev.target));
  data.fm = ev.target.fm.checked;
  data.nodes = true;
  data.expiry = data.kind === "bc" ? 60 : 30;
  data.outbound = true;
  sendingUntil = Date.now() + 5000;
  document.getElementById("send").hidden = true;
  document.getElementById("sending").hidden = false;
  const res = await fetch("/api/send", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(data)});
  if (!res.ok) {
    sendingUntil = 0;
    document.getElementById("send").hidden = false;
    document.getElementById("sending").hidden = true;
    alert(await res.text());
    return;
  }
  ev.target.msg.value = "";
  setTimeout(() => {
    sendingUntil = 0;
    document.getElementById("send").hidden = false;
    document.getElementById("sending").hidden = true;
  }, 5000);
};
</script>
</body>
